name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          if echo "$CHANGED" | grep -q '^backend/'; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -q '^tg-app/'; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: 72.56.38.179
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/mia-amore
            git pull

            # Один раз: добавить no-cache заголовки для index.html в nginx
            python3 << 'PYEOF'
            import os, subprocess
            conf_path = '/etc/nginx/sites-available/app.sikretsweet.ru'
            if not os.path.exists(conf_path):
                print(f"nginx config not found: {conf_path}")
                exit(0)
            conf = open(conf_path).read()
            if 'no-store' in conf:
                print("nginx: no-cache headers already present")
                exit(0)
            block = '\n    location ~* index\\.html$ {\n        add_header Cache-Control "no-store, no-cache, must-revalidate";\n        expires -1;\n    }'
            new_conf = conf.replace('server {', 'server {' + block, 1)
            open(conf_path, 'w').write(new_conf)
            r = subprocess.run(['nginx', '-t'], capture_output=True, text=True)
            if r.returncode != 0:
                open(conf_path, 'w').write(conf)
                print("nginx -t failed, config restored:", r.stderr)
                exit(1)
            subprocess.run(['systemctl', 'reload', 'nginx'])
            print("nginx: no-cache headers added and reloaded")
            PYEOF

            if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
              rsync -a --delete /home/deploy/mia-amore/tg-app/ /var/www/app.sikretsweet.ru/
              echo "Frontend synced to /var/www/app.sikretsweet.ru/"
            fi
            if [ "${{ steps.changes.outputs.backend }}" = "true" ]; then
              systemctl restart miamore.service
              echo "Backend restarted"
            fi
