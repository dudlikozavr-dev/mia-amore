name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          if echo "$CHANGED" | grep -q '^backend/'; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -q '^tg-app/'; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: 72.56.38.179
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/mia-amore
            git pull
            if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
              rsync -a --delete /home/deploy/mia-amore/tg-app/ /var/www/app.sikretsweet.ru/
              echo "Frontend synced to /var/www/app.sikretsweet.ru/"
            fi
            if [ "${{ steps.changes.outputs.backend }}" = "true" ]; then
              systemctl restart miamore.service
              echo "Backend restarted"
            fi
